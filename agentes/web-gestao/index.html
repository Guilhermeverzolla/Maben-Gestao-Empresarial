<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Central de gestão · MABEN</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/estilo.css">
<style>:root{--c:#b4562f} header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.live{font-size:12.5px;opacity:.95}.feed li{padding:6px 0;border-bottom:1px solid #f0e6d6;list-style:none}.feed{margin:0;padding:0;max-height:420px;overflow:auto}
.sp{display:flex;gap:6px;align-items:flex-end;height:90px}.sp div{flex:1;background:var(--c);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.sp div span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:11px;color:var(--dim)}.sp small{display:block;text-align:center;font-size:10.5px;color:var(--dim);margin-top:2px}</style>
</head><body>
<header><div><small>Central de gestão · direção</small><h1 id="esc">MABEN</h1><p>Tudo o que está acontecendo no escritório, ao vivo.</p></div>
<div class="live"><span class="pulse" id="pulso"></span><span id="hora">conectando…</span></div></header>
<main id="v">Carregando…</main>
<script src="/app.js"></script>
</body></html>
